# Drift configuration — profile: vibe-coding
# Optimised for AI-accelerated codebases (Copilot, Cursor, Claude). Upweights copy-paste detection, bypass accumulation, and test polarity deficit — the dominant debt vectors in vibe-coded repos.
# Generated by: drift init --profile vibe-coding

include:
- '**/*.py'
- '**/*.ts'
- '**/*.tsx'
exclude:
- '**/node_modules/**'
- '**/__pycache__/**'
- '**/venv/**'
- '**/.venv/**'
- '**/.tmp_*venv*/**'
- '**/.env/**'
- '**/.conda/**'
- '**/.git/**'
- '**/dist/**'
- '**/build/**'
- '**/.tox/**'
- '**/.nox/**'
- '**/site-packages/**'
- '**/.pixi/**'
- '**/*.egg-info/**'
- '**/docs/**'
- '**/docs_src/**'
- '**/examples/**'
- '**/tests/**'
- '**/scripts/**'
- '**/site/**'
weights:
  mutant_duplicate: 0.2
  pattern_fragmentation: 0.18
  architecture_violation: 0.14
  temporal_volatility: 0.0
  system_misalignment: 0.08
  explainability_deficit: 0.1
  bypass_accumulation: 0.06
  test_polarity_deficit: 0.06
  naming_contract_violation: 0.04
  broad_exception_monoculture: 0.04
  guard_clause_deficit: 0.03
  doc_impl_drift: 0.02
  exception_contract_drift: 0.02
  cohesion_deficit: 0.01
  co_change_coupling: 0.005
auto_calibrate: true
fail_on: none
thresholds:
  similarity_threshold: 0.75
  min_function_loc: 8
  min_complexity: 4
  recency_days: 14
  volatility_z_threshold: 1.5
  max_discovery_files: 10000
policies:
  layer_boundaries:
  - name: No DB imports in API layer
    from: api/**
    deny_import:
    - db.*
    - models.*
    - repositories.*
  - name: No API imports in DB layer
    from: db/**
    deny_import:
    - api.*
    - routes.*
    - views.*
  max_pattern_variants:
    error_handling: 2
    data_access: 2
    api_endpoint: 3
